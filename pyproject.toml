[project]
name = "comfyui-visual-suite"
version = "1.7.0"
description = "Twelve visual nodes for ComfyUI: idea box, prompt composer with image reading, series book, series lab, filename manager, save image with folder browsing, image viewer, series report, series layout for print, web and film, latent size picker, node bag and image crop."
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = []
keywords = [
    "prompt",
    "filename",
    "save",
    "crop",
    "latent",
    "resolution",
    "lora",
    "workflow",
    "ui",
    "editorial",
    "viewer",
    "layout",
    "indesign",
    "video",
]

[project.urls]
Repository = "https://github.com/StudioLeiel/comfyui-visual-suite"
"Bug Tracker" = "https://github.com/StudioLeiel/comfyui-visual-suite/issues"

[tool.comfy]
PublisherId = "studioleiel"
DisplayName = "Visual Suite (Studio Leiel)"
Icon = "https://raw.githubusercontent.com/StudioLeiel/comfyui-visual-suite/main/docs/images/icon.png"
