[project]
name = "comfyui-visual-suite"
version = "1.2.1"
description = "Seven visual nodes for ComfyUI: prompt composer with image reading, series lab, filename manager, save image with folder browsing, latent size picker, node bag and image crop."
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = []
keywords = [
    "prompt",
    "filename",
    "save",
    "crop",
    "latent",
    "resolution",
    "lora",
    "workflow",
    "ui",
    "editorial",
]

[project.urls]
Repository = "https://github.com/StudioLeiel/comfyui-visual-suite"
"Bug Tracker" = "https://github.com/StudioLeiel/comfyui-visual-suite/issues"

[tool.comfy]
PublisherId = "studioleiel"
DisplayName = "Visual Suite (Studio Leiel)"
Icon = "https://raw.githubusercontent.com/StudioLeiel/comfyui-visual-suite/main/docs/images/icon.png"
